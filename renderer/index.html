  <div id="app">
    <!-- SIDEBAR: note list + search -->
    <aside id="sidebar">
      <div class="sb-head">
        <span class="sb-title" data-i18n="โน้ต">โน้ต</span>
        <button id="newFolderBtn" class="ghost" title="กล่องใหม่" data-i18n-title="กล่องใหม่"></button>
        <button id="newNoteBtn" class="ghost" title="โน้ตใหม่" data-i18n-title="โน้ตใหม่"></button>
      </div>
      <div class="search-row">
        <div class="search-field">
          <svg class="ic sm srch-ic"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="ค้นหา…" data-i18n-ph="ค้นหา…" />
          <kbd class="search-kbd">⌘F</kbd>
        </div>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <div id="noteList" class="note-list"></div>
      <div class="sb-actions">
        <button id="newMenuBtn" title="สร้างใหม่" data-i18n-title="สร้างใหม่"><svg class="ic sm"><use href="#i-plus"/></svg><span data-i18n="ใหม่">ใหม่</span></button>
        <span class="rail-sp"></span>
        <button id="settingsBtn2" class="ghost sm" title="ตั้งค่า" data-i18n-title="ตั้งค่า"><svg class="ic"><use href="#i-settings"/></svg></button>
        <button id="trashBtn2" class="ghost sm" title="ถังขยะ" data-i18n-title="ถังขยะ"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
      <div id="vaultChip">
        <svg class="ic sm vc-crate"><use href="#i-crate"/></svg>
        <span class="vault-nm">Vault</span>
        <svg class="ic xs vc-caret"><use href="#i-chevdown"/></svg>
      </div>
    </aside>

    <!-- LEFT: editor -->
    <section id="left">
      <header class="bar">
        <div class="bar-left">
          <div class="crumb" id="crumb"><b data-i18n="โน้ต">โน้ต</b></div>
</div>
        <div class="bar-right">
          <span id="collabBar" hidden>
            <span id="collabStatus" class="collab-status"></span>
            <span id="collabPresence" class="collab-presence"></span>
          </span>
          <span class="saved-tag" id="savedTag" title="บันทึกแล้ว" data-i18n-title="บันทึกแล้ว"><i class="dot"></i><span class="saved-txt" data-i18n="บันทึกแล้ว">บันทึกแล้ว</span></span>
          <span id="dirty" class="dirty" hidden></span>
          <button id="aiMenuBtn" class="ghost" title="เครื่องมือ AI" data-i18n-title="เครื่องมือ AI"><svg class="ic"><use href="#i-sparkle"/></svg></button>
          <button id="autolinkBtn" class="ghost" title="ร้อยเชือก — AI แนะนำลิงก์ไปโน้ตอื่น" data-i18n-title="ร้อยเชือก — AI แนะนำลิงก์ไปโน้ตอื่น"><svg class="ic"><use href="#i-thread"/></svg></button>
          <button id="sideChatBtn" class="ghost" title="แชตลอย (⌘J)" data-i18n-title="แชตลอย (⌘J)"><svg class="ic"><use href="#i-chat"/></svg></button>
          <button id="saveBtn" class="ghost" title="บันทึก (⌘S)" data-i18n-title="บันทึก (⌘S)"><svg class="ic"><use href="#i-save"/></svg></button>
          <span class="bar-div"></span>
          <button id="sidebarToggle" class="ghost" title="ซ่อน/แสดงแถบโน้ต" data-i18n-title="ซ่อน/แสดงแถบโน้ต"><svg class="ic"><use href="#i-sidebar"/></svg></button>
          <button id="termToggle" class="ghost" title="ซ่อน/แสดงพาเนล AI" data-i18n-title="ซ่อน/แสดงพาเนล AI"><svg class="ic"><use href="#i-panel"/></svg></button>
          <button id="tldrBtn" class="ghost" hidden>TL;DR</button>
          <button id="quizBtn" class="ghost" hidden data-i18n="ทดสอบฉัน">ทดสอบฉัน</button>
          <button id="settingsBtn" class="ghost" hidden data-i18n="ตั้งค่า">ตั้งค่า</button>
          <button id="themeBtn" class="ghost" hidden data-i18n="ธีม">ธีม</button>
        </div>
      </header>

      <div id="propsBar" class="props-bar">
        <label data-i18n="สถานะ">สถานะ</label>
        <select id="statusSelect">
          <option value="" data-i18n="— ไม่ระบุ —">— ไม่ระบุ —</option>
          <option value="ใหม่" data-i18n="ใหม่">ใหม่</option>
          <option value="กำลังอ่าน" data-i18n="กำลังอ่าน">กำลังอ่าน</option>
          <option value="เข้าใจแล้ว" data-i18n="เข้าใจแล้ว">เข้าใจแล้ว</option>
          <option value="ต้องทวน" data-i18n="ต้องทวน">ต้องทวน</option>
        </select>
        <label data-i18n="แท็ก">แท็ก</label>
        <input id="tagsInput" type="text" placeholder="เช่น สอบกลางภาค, ต้องทวน" data-i18n-ph="เช่น สอบกลางภาค, ต้องทวน" />
      </div>

      <div id="reloadBanner" class="banner" hidden>
        <span><b data-i18n="Claude แก้ไฟล์นี้">Claude แก้ไฟล์นี้</b> — <span data-i18n="คุณมีการแก้ที่ยังไม่บันทึก">คุณมีการแก้ที่ยังไม่บันทึก</span></span>
        <span>
          <button id="reloadKeep" class="ghost sm" data-i18n="เก็บของฉัน">เก็บของฉัน</button>
          <button id="reloadTake" class="solid sm" data-i18n="โหลดของ Claude">โหลดของ Claude</button>
        </span>
      </div>

      <div id="aiUndo" class="ai-undo" hidden><span data-i18n="AI แก้โน้ตนี้แล้ว">AI แก้โน้ตนี้แล้ว</span><span><button id="aiUndoBtn" class="ghost sm" data-i18n="↩ เลิกทำ AI">↩ เลิกทำ AI</button><button id="aiUndoDismiss" class="ghost sm" data-i18n="ปิด">ปิด</button></span></div>

      <div id="editorWrap">
        <div id="noteTitle" class="note-title" hidden></div>
        <div id="editorHost"></div>
      </div>
      <div id="graphView" class="main-view"></div>
      <div id="tableView" class="main-view"></div>
      <div id="dashView" class="main-view"></div>
      <div id="crateView" class="main-view"></div>
      <div id="trashView" class="main-view"></div>
      <div id="pdfView" class="main-view">
        <div class="pdf-toolbar">
          <span class="pdf-nav">
            <button id="pdfPrev" title="หน้าก่อน" data-i18n-title="หน้าก่อน">‹</button>
            <span id="pdfCount">1 / 1</span>
            <button id="pdfNext" title="หน้าถัดไป" data-i18n-title="หน้าถัดไป">›</button>
          </span>
          <span class="pdf-spacer"></span>
          <button id="pdfNoteBtn" class="pdf-tb" title="โน้ตคู่หูของ PDF นี้" data-i18n-title="โน้ตคู่หูของ PDF นี้"><svg class="ic sm"><use href="#i-note"/></svg></button>
          <button id="pdfAnnotsBtn" class="pdf-tb" title="รายการไฮไลต์" data-i18n-title="รายการไฮไลต์"><svg class="ic sm"><use href="#i-list"/></svg></button>
          <button id="pdfCropBtn" class="pdf-tb" title="ตัดกระดาษ / เลือกพื้นที่ (ไฮไลต์ภาพสแกนได้)" data-i18n-title="ตัดกระดาษ / เลือกพื้นที่ (ไฮไลต์ภาพสแกนได้)"><svg class="ic sm"><use href="#i-scissors"/></svg></button>
          <button id="pdfTextBtn" class="pdf-tb" title="ใส่กล่องข้อความ" data-i18n-title="ใส่กล่องข้อความ"><svg class="ic sm"><use href="#i-text"/></svg></button>
        </div>
        <div class="pdf-body">
          <div id="pdfPages"></div>
          <aside id="pdfAnnotsPanel" hidden></aside>
        </div>
      </div>

      <div id="backlinks" class="backlinks" hidden></div>
      <div id="autolinkBar" hidden></div>

      <!-- selection action bar -->
      <div id="actionBar" class="action-bar" hidden>
        <span class="sel-label"><span data-i18n="เลือก: ">เลือก: </span><b id="selText"></b></span>
        <div class="action-btns">
          <button data-act="explain"><svg class="ic sm"><use href="#i-sparkle"/></svg> <span data-i18n="อธิบาย">อธิบาย</span></button>
          <button data-act="search"><svg class="ic sm"><use href="#i-search"/></svg> <span data-i18n="หาข้อมูล">หาข้อมูล</span></button>
          <button data-act="link"><svg class="ic sm"><use href="#i-link"/></svg> <span data-i18n="ทำลิงก์">ทำลิงก์</span></button>
          <button data-act="task"><svg class="ic sm"><use href="#i-task"/></svg> <span data-i18n="เพิ่มเป็น Task">เพิ่มเป็น Task</span></button>
          <button data-act="sidechat" title="คุยเรื่องนี้ในแชตลอย" data-i18n-title="คุยเรื่องนี้ในแชตลอย"><svg class="ic sm"><use href="#i-chat"/></svg> <span data-i18n="คุยเรื่องนี้">คุยเรื่องนี้</span></button>
        </div>
      </div>
    </section>

    <div id="divider"></div>

    <!-- RIGHT: terminal -->
    <section id="right">
      <header class="bar term-bar">
        <div class="bar-left"></div>
        <div class="bar-right">
          <button id="chatClearBtn" class="ghost" title="ล้างแชต" data-i18n-title="ล้างแชต"><svg class="ic"><use href="#i-eraser"/></svg></button>
          <button id="termPosBtn" class="ghost" title="ลากหรือกดเพื่อย้าย ขวา/ล่าง" data-i18n-title="ลากหรือกดเพื่อย้าย ขวา/ล่าง"><svg class="ic"><use href="#i-swap"/></svg></button>
          <select id="engineSelect" title="เลือก engine" data-i18n-title="เลือก engine"><option value="glm">GLM (OpenCode)</option><option value="claude">Claude</option></select>
          <select id="modelSelect" title="โมเดล GLM" data-i18n-title="โมเดล GLM"><option value="glm-5.2">glm-5.2</option><option value="glm-5.1">glm-5.1</option><option value="glm-5-turbo">glm-5-turbo</option><option value="glm-4.7">glm-4.7</option><option value="glm-4.5-air">glm-4.5-air</option></select>

          <button id="termStopBtn" class="ghost" title="หยุดคำสั่ง (Ctrl+C)" data-i18n-title="หยุดคำสั่ง (Ctrl+C)"><svg class="ic"><use href="#i-stop"/></svg></button>
          <button id="termRestartBtn" class="ghost" title="รีสตาร์ท terminal" data-i18n-title="รีสตาร์ท terminal"><svg class="ic"><use href="#i-refresh"/></svg></button>
          <button id="clearBtn" class="ghost" title="ล้างจอ" data-i18n-title="ล้างจอ"><svg class="ic"><use href="#i-eraser"/></svg></button>
          <button id="termHideBtn" class="ghost" title="ซ่อน terminal" data-i18n-title="ซ่อน terminal"><svg class="ic"><use href="#i-x"/></svg></button>

      <div id="chatPanel">

          <button id="chatSend" title="ส่ง" data-i18n-title="ส่ง"><svg class="ic sm"><use href="#i-send"/></svg></button>
        </div>
